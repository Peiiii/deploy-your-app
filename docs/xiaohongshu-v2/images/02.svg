<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1440" viewBox="0 0 1080 1440"><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="1440" rx="0" fill="#f5f4ed"/><text x="64" y="82" fill="#2b7158" font-size="24" font-weight="600">不知道怎么准备文件？</text><text x="934" y="82" fill="#62716b" font-size="22" font-weight="400">02 / 10</text><text x="64" y="192" fill="#1e302b" font-size="64" font-weight="700">把这段话</text><text x="64" y="278" fill="#1e302b" font-size="64" font-weight="700">发给写代码的 AI</text><text x="64" y="355" fill="#62716b" font-size="29" font-weight="400">记得把项目文件一起给它</text><rect x="64" y="422" width="952" height="572" rx="24" fill="#1e302b"/><text x="104" y="499" fill="#f4f7ef" font-size="34" font-weight="400">请检查这个项目，告诉我：</text><text x="104" y="546" fill="#f4f7ef" font-size="34" font-weight="400"></text><text x="104" y="593" fill="#f4f7ef" font-size="34" font-weight="400">01  最后交付的是 HTML、ZIP，</text><text x="104" y="640" fill="#f4f7ef" font-size="34" font-weight="400">      还是 GitHub 仓库？</text><text x="104" y="687" fill="#f4f7ef" font-size="34" font-weight="400"></text><text x="104" y="734" fill="#f4f7ef" font-size="34" font-weight="400">02  需不需要构建？</text><text x="104" y="781" fill="#f4f7ef" font-size="34" font-weight="400">      构建命令和输出目录是什么？</text><text x="104" y="828" fill="#f4f7ef" font-size="34" font-weight="400"></text><text x="104" y="875" fill="#f4f7ef" font-size="34" font-weight="400">03  有没有必须运行的后端，</text><text x="104" y="922" fill="#f4f7ef" font-size="34" font-weight="400">      或需要保密的 API Key？</text><rect x="64" y="1051" width="210" height="52" rx="12" fill="#deeadc"/><text x="84" y="1087" fill="#2b7158" font-size="25" font-weight="600">看完回答再选</text><text x="64" y="1160" fill="#1e302b" font-size="34" font-weight="400">只有一份 HTML，就看第 5 张。</text><text x="64" y="1216" fill="#1e302b" font-size="34" font-weight="400">有其他文件的，先问清楚怎么打包。</text><path d="M64 1330H1016" stroke="#d6ddd2"/><text x="64" y="1377" fill="#62716b" font-size="23" font-weight="400">如果项目带后端，也让它说明后端要放在哪里</text><text x="925" y="1377" fill="#2b7158" font-size="34" font-weight="400">→</text></g></svg>