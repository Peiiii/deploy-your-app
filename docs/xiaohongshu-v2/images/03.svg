<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1440" viewBox="0 0 1080 1440"><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="1440" rx="0" fill="#f5f4ed"/><text x="64" y="82" fill="#2b7158" font-size="24" font-weight="600">工具与入口</text><text x="934" y="82" fill="#62716b" font-size="22" font-weight="400">03 / 10</text><text x="64" y="192" fill="#1e302b" font-size="64" font-weight="700">把网页变成</text><text x="64" y="278" fill="#1e302b" font-size="64" font-weight="700">可分享的网址</text><text x="64" y="355" fill="#62716b" font-size="29" font-weight="400">下面用 GemiGo 演示，不需要先准备 GitHub 仓库</text><rect x="64" y="415" width="952" height="238" rx="24" fill="#1e302b"/><text x="102" y="482" fill="#b9c9bb" font-size="28" font-weight="400">本篇使用的网页部署工具</text><text x="102" y="555" fill="#fff" font-size="58" font-weight="700">GemiGo</text><text x="102" y="614" fill="#fff" font-size="35" font-weight="500">浏览器地址栏输入：gemigo.io</text><text x="80" y="761" fill="#1e302b" font-size="37" font-weight="500">01  HTML   →  AI 给你一整段网页代码</text><text x="80" y="891" fill="#1e302b" font-size="37" font-weight="500">02  ZIP       →  手里已有项目压缩包</text><text x="80" y="1021" fill="#1e302b" font-size="37" font-weight="500">03  GitHub →  代码已经放在仓库里</text><rect x="64" y="1148" width="952" height="114" rx="24" fill="#deeadc"/><text x="96" y="1218" fill="#2b7158" font-size="33" font-weight="600">按手里的文件选一种，不用三种都做。</text><path d="M64 1330H1016" stroke="#d6ddd2"/><text x="64" y="1377" fill="#62716b" font-size="23" font-weight="400">GemiGo · gemigo.io｜先建项目，再按来源选择入口</text><text x="925" y="1377" fill="#2b7158" font-size="34" font-weight="400">→</text></g></svg>