<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1440" viewBox="0 0 1080 1440"><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="1440" rx="0" fill="#f5f4ed"/><text x="64" y="82" fill="#2b7158" font-size="24" font-weight="600">AI 写网页</text><text x="934" y="82" fill="#62716b" font-size="22" font-weight="400">01 / 10</text><text x="64" y="192" fill="#1e302b" font-size="64" font-weight="700">网页写好了</text><text x="64" y="278" fill="#1e302b" font-size="64" font-weight="700">怎么发给朋友看？</text><text x="64" y="355" fill="#62716b" font-size="29" font-weight="400">地址还是 localhost:5173？</text><rect x="64" y="425" width="952" height="310" rx="24" fill="#1e302b"/><text x="105" y="490" fill="#b9c9bb" font-size="28" font-weight="400">你电脑上的预览</text><text x="105" y="577" fill="#ffffff" font-size="64" font-weight="600">localhost:5173</text><text x="105" y="669" fill="#cbd6cd" font-size="30" font-weight="400">复制这个地址，对方访问的是他自己的电脑。</text><text x="493" y="817" fill="#2b7158" font-size="64" font-weight="400">↓</text><rect x="64" y="865" width="952" height="278" rx="24" fill="#deeadc"/><text x="105" y="932" fill="#2b7158" font-size="28" font-weight="400">部署以后</text><text x="105" y="1013" fill="#1e302b" font-size="53" font-weight="700">发一个链接就能看</text><text x="105" y="1083" fill="#62716b" font-size="32" font-weight="400">下面从最简单的 HTML 说起。</text><path d="M64 1330H1016" stroke="#d6ddd2"/><text x="64" y="1377" fill="#62716b" font-size="23" font-weight="400">HTML / ZIP / GitHub，按你手里的文件来</text><text x="925" y="1377" fill="#2b7158" font-size="34" font-weight="400">→</text></g></svg>