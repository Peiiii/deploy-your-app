<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1440" viewBox="0 0 1080 1440"><g font-family="PingFang SC, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="1440" rx="0" fill="#f5f4ed"/><text x="64" y="82" fill="#2b7158" font-size="24" font-weight="600">发给朋友之前</text><text x="934" y="82" fill="#62716b" font-size="22" font-weight="400">10 / 10</text><text x="64" y="192" fill="#1e302b" font-size="64" font-weight="700">拿手机打开一下</text><text x="64" y="278" fill="#1e302b" font-size="64" font-weight="700">顺手检查这几项</text><text x="64" y="355" fill="#62716b" font-size="29" font-weight="400">尤其看看图片有没有丢，按钮能不能点</text><rect x="64" y="425" width="952" height="617" rx="24" fill="#ffffff"/><text x="108" y="509" fill="#1e302b" font-size="35" font-weight="400">□  地址不是 localhost 或项目后台</text><text x="108" y="602" fill="#1e302b" font-size="35" font-weight="400">□  用未登录窗口再打开一次</text><text x="108" y="695" fill="#1e302b" font-size="35" font-weight="400">□  检查图片、字体和手机排版</text><text x="108" y="788" fill="#1e302b" font-size="35" font-weight="400">□  刷新页面，再点主要按钮</text><text x="108" y="881" fill="#1e302b" font-size="35" font-weight="400">□  检查接口、登录和数据读写</text><text x="108" y="974" fill="#1e302b" font-size="35" font-weight="400">□  确认前端没有暴露私密密钥</text><rect x="64" y="1092" width="952" height="159" rx="24" fill="#deeadc"/><text x="100" y="1153" fill="#2b7158" font-size="32" font-weight="600">图里用的是 GemiGo</text><text x="100" y="1206" fill="#2b7158" font-size="32" font-weight="600">浏览器打开 gemigo.io 就能找到。</text><path d="M64 1330H1016" stroke="#d6ddd2"/><text x="64" y="1377" fill="#62716b" font-size="23" font-weight="400">有登录、数据库或支付的，记得把这些也测一遍</text><text x="925" y="1377" fill="#2b7158" font-size="34" font-weight="400">→</text></g></svg>