name: Repair historical app thumbnails

on:
  workflow_dispatch:
    inputs:
      start_after:
        description: Resume after a project ID from the previous repair report (blank starts over)
        type: string
        default: ''

# Independent from new-release capture; never fills its queue or blocks its runner.
concurrency:
  group: repair-historical-app-thumbnails
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      REPAIR_START_AFTER: ${{ inputs.start_after }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install screenshot dependencies
        run: |
          python -m pip install boto3==1.40.0 Pillow==12.0.0 playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Repair missing historical covers
        run: >-
          python scripts/capture-missing-thumbnails.py --repair-all
          --start-after "$REPAIR_START_AFTER" --max-projects 1000
          --report thumbnail-repair-report.json
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thumbnail-repair-report
          path: thumbnail-repair-report.json
          retention-days: 14
          if-no-files-found: warn
