name: Validate optional local builder

# Production static publication runs entirely in Cloudflare. This workflow
# intentionally has no SSH/deploy step: Docker-fupf belongs to Xianyu now.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t deploy-your-app-server:validation .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-deployment-sandbox.mjs
        env:
          BUILD_TEST_IMAGE: deploy-your-app-server:validation
