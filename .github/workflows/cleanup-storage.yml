name: Validate storage cleanup

# Production storage cleanup belongs to Cloudflare. Never SSH into the
# repurposed Xianyu host or delete its retained builder backup.
on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:app-storage
      - run: pnpm test:static-publication
