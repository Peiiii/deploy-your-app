<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>创意实验室 · GemiGo</title>
    <script src="https://docs.gemigo.io/sdk/0.3.1/gemigo-app-sdk.umd.js"></script>
    <style>
      body {
        margin: 0;
        background: #f7f1ea;
        font-family: system-ui;
        color: #403c47;
        line-height: 1.7;
      }
      main {
        max-width: 750px;
        margin: auto;
        padding: 32px 20px;
      }
      section {
        background: #fff;
        padding: 25px;
        border-radius: 20px;
        margin: 20px 0;
      }
      h1 {
        font-size: 38px;
      }
      button {
        border: 0;
        background: #6556a5;
        color: white;
        padding: 11px 17px;
        border-radius: 9px;
        cursor: pointer;
        margin: 5px;
      }
      a {
        color: #6556a5;
      }
      .swatches {
        display: flex;
        height: 140px;
        border-radius: 12px;
        overflow: hidden;
      }
      .swatches div {
        flex: 1;
      }
      #status {
        white-space: pre-wrap;
      }
      input {
        width: 100px;
        height: 45px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>
        <a href="https://docs.gemigo.io">GemiGo · 创意实验室</a> ·
        <a target="_blank" href="https://gemigo.io/wallet">同一个点数钱包 ↗</a>
      </p>
      <h1>从一种颜色，寻找灵感。</h1>
      <p>基础色彩探索免费；一次解锁配色工具。</p>
      <button id="login">登录 / 重新授权</button>
      <p id="status" role="status">体验点无现金价值。登录后可从平台钱包领取。</p>
      <div id="confirm"></div>
      <section>
        <h2>基础色彩</h2>
        <input id="color" type="color" value="#785dc9" />
        <div class="swatches" id="base"></div>
      </section>
      <section>
        <h2>配色生成工具</h2>
        <button id="unlock">一次解锁配色工具</button>
        <div id="premium" hidden>
          <p>选择主色，生成互补与邻近色组合。</p>
          <button id="generate">生成配色</button>
          <div class="swatches" id="palette"></div>
          <p id="hexes"></p>
        </div>
      </section>
      <p>
        <a href="https://knowledge-lab.gemigo.app">去知识实验室 →</a> ·
        <a href="https://docs.gemigo.io/examples">下载源码</a>
      </p>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let items = [];
      let busy = false;
      const tell = (s) => ($('status').textContent = s);
      function swatches(id, colors) {
        $(id).replaceChildren(
          ...colors.map((color) => {
            const div = document.createElement('div');
            div.style.background = color;
            div.title = color;
            return div;
          })
        );
      }
      function generate() {
        const hex = $('color').value;
        const n = parseInt(hex.slice(1), 16);
        const r = n >> 16,
          g = (n >> 8) & 255,
          b = n & 255;
        const colors = [
          hex,
          '#' + (((255 - r) << 16) | ((255 - g) << 8) | (255 - b)).toString(16).padStart(6, '0'),
          '#' + ((g << 16) | (b << 8) | r).toString(16).padStart(6, '0'),
        ];
        swatches('palette', colors);
        $('hexes').textContent = colors.join(' · ');
      }
      async function restore() {
        items = await gemigo.points.items();
        const grants = await gemigo.points.grants();
        $('premium').hidden = !grants.durable.some((g) => g.entitlement === 'palette');
        generate();
      }
      $('login').onclick = async () => {
        try {
          await gemigo.auth.login({ scopes: ['identity:basic', 'points:use'] });
          await restore();
          tell('已登录并恢复权益。');
        } catch (e) {
          tell(e.message);
        }
      };
      $('unlock').onclick = async () => {
        if (busy) return;
        busy = true;
        try {
          const item = items.find((i) => i.entitlement === 'palette');
          if (!item) throw new Error('先登录或等待收费项启用');
          const requestId = localStorage.getItem('purchase:palette') || crypto.randomUUID();
          localStorage.setItem('purchase:palette', requestId);
          const result = await gemigo.points.purchase({ itemId: item.id, requestId });
          if (result.status === 'granted') {
            localStorage.removeItem('purchase:palette');
            tell('配色工具已解锁。');
          } else {
            tell('消费状态：' + result.status);
            if (result.confirmationUrl) {
              const a = document.createElement('a');
              a.href = result.confirmationUrl;
              a.target = '_blank';
              a.textContent = '打开平台确认';
              $('confirm').replaceChildren(a);
            }
          }
          await restore();
        } catch (e) {
          tell(e.message);
        } finally {
          busy = false;
        }
      };
      $('generate').onclick = generate;
      $('color').oninput = () => {
        swatches('base', [$('color').value]);
        generate();
      };
      swatches('base', [$('color').value]);
      if (gemigo.auth.getAccessToken())
        restore()
          .then(() => tell('已恢复登录与权益。'))
          .catch((e) => tell(e.message));
    </script>
  </body>
</html>
