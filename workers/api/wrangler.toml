name = "gemigo-api"
main = "src/index.ts"
compatibility_date = "2026-09-18"
compatibility_flags = ["global_fetch_strictly_public"]

# Uncomment and set your Cloudflare account ID once known.
account_id = "adb27b39051202962038992eeaf8f6bb"

[ai]
binding = "RECOMMENDATION_AI"

# The production D1 primary is NRT. Avoid repeated cross-region database trips.
[placement]
region = "aws:ap-northeast-1"

[vars]
# These mirror the Node backend defaults. Override per environment via
# `wrangler secret put` or environment-specific sections when needed.
APPS_ROOT_DOMAIN = "gemigo.app"
DEPLOY_TARGET = "r2"
PLATFORM_AI_BASE_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1"
PLATFORM_AI_MODEL = "qwen3.8-flash"
# Where the frontend lives; used to build OAuth redirect URLs.
AUTH_REDIRECT_BASE = "https://gemigo.io"
# URL of the Node deployment service used for /deploy requests.
# Override per environment (e.g. via `wrangler secret|var put`) to point at the
# real backend host. Local dev defaults to the Node dev server.
DEPLOY_SERVICE_BASE_URL = "https://builderapi.gemigo.io/api/v1"

[[d1_databases]]
binding = "PROJECTS_DB"
database_name = "gemigo-projects"
# Replace the placeholder IDs with the actual Database IDs from Cloudflare.
database_id = "e1e28d75-d0a0-4f8e-9b5d-714454686a4f"
# Optional: configure a preview database for `wrangler dev`.
preview_database_id = "e1e28d75-d0a0-4f8e-9b5d-714454686a4f"

[[r2_buckets]]
binding = "ASSETS"
# Use the same bucket as the R2 gateway Worker so that thumbnails uploaded
# via the API are immediately visible under apps/<slug>/thumbnail.png.
bucket_name = "gemigo-apps"

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "gemigo-projects"
database_id = "e1e28d75-d0a0-4f8e-9b5d-714454686a4f"

# Reconcile accepted deployments after disconnected clients.
[triggers]
crons = ["*/2 * * * *"]

# Internal rendered text extraction for language matching.
[[services]]
binding = "APP_CONTENT"
service = "gemigo-screenshot-service"

# Application-scoped in-flight calls, revocation and transport lifecycle.
[[durable_objects.bindings]]
name = "APP_GATEWAY"
class_name = "AppGateway"

[[migrations]]
tag = "app-gateway-v1"
new_sqlite_classes = ["AppGateway"]
