<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Frontend Version: 1.0.1 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="version" content="1.0.1" />

    <script>
      // Establish the enhanced startup state before the first browser paint.
      document.documentElement.classList.add('app-booting');
      try {
        const saved = JSON.parse(localStorage.getItem('gemigo-ui-preferences') || 'null');
        if (saved?.state?.sidebarCollapsed === true) {
          document.documentElement.style.setProperty('--bootstrap-sidebar-width', '64px');
        }
      } catch { /* Startup still works when storage is unavailable. */ }
      window.addEventListener('error', (event) => {
        if (event.target === window || event.target?.type === 'module') {
          document.documentElement.classList.remove('app-booting');
        }
      }, true);
    </script>

    <!-- seo-head -->
    <link rel="dns-prefetch" href="//assets.gemigo.app" />
    <link rel="preconnect" href="https://assets.gemigo.app" crossorigin />
    <meta name="theme-color" content="#8b5cf6" />

    <style>
      :root {
        --bg-main: #f8fafc;
        --bg-surface: #ffffff;
        --bg-highlight: #f1f5f9;
        --border-main: #e2e8f0;
        --border-highlight: #cbd5e1;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --glass-bg: rgba(255, 255, 255, 0.7);
        --glass-border: rgba(0, 0, 0, 0.05);
      }

      .dark {
        --bg-main: #020617;
        --bg-surface: #0f172a;
        --bg-highlight: #1e293b;
        --border-main: #1e293b;
        --border-highlight: #334155;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --glass-bg: rgba(15, 23, 42, 0.6);
        --glass-border: rgba(255, 255, 255, 0.05);
      }

      body {
        background-color: var(--bg-main);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .dark body {
        background-image:
          radial-gradient(circle at 15% 50%, rgba(139, 92, 246, 0.15), transparent 30%),
          radial-gradient(circle at 85% 30%, rgba(236, 72, 153, 0.15), transparent 30%);
      }

      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--glass-border);
      }

      .glass-card {
        background: var(--bg-surface);
        backdrop-filter: blur(8px);
        border: 1px solid var(--border-main);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05),
          0 2px 4px -1px rgba(0, 0, 0, 0.03);
      }

      .dark .glass-card {
        background: linear-gradient(
          180deg,
          rgba(30, 41, 59, 0.7) 0%,
          rgba(15, 23, 42, 0.6) 100%
        );
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
      }

      .glass-card:hover {
        border-color: rgba(139, 92, 246, 0.3);
        box-shadow: 0 0 15px rgba(139, 92, 246, 0.1);
      }

      .terminal-scroll::-webkit-scrollbar {
        width: 6px;
      }

      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }

      .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: rgba(148, 163, 184, 0.5);
        border-radius: 3px;
      }

      .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background-color: rgba(148, 163, 184, 0.8);
      }

      .dark .scrollbar-thin::-webkit-scrollbar-thumb {
        background-color: rgba(51, 65, 85, 0.5);
      }

      .dark .scrollbar-thin::-webkit-scrollbar-thumb:hover {
        background-color: rgba(51, 65, 85, 0.8);
      }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .terminal-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .terminal-scroll::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 3px;
      }
      .terminal-scroll::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }

      .token-keyword {
        color: #c084fc;
      }
      .token-string {
        color: #4ade80;
      }
      .token-function {
        color: #60a5fa;
      }
      .token-comment {
        color: #64748b;
      }
      .seo-content { max-width: 64rem; margin: 2rem auto; padding: 1.5rem; font: 1rem/1.7 system-ui,sans-serif; }
      .seo-content h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; }
      .seo-content h2 { font-size: 1.15rem; font-weight: 600; margin: 1.5rem 0 .5rem; }
      .seo-content p { margin-bottom: 1rem; }
      .seo-content nav { display: flex; flex-wrap: wrap; gap: 1rem; margin: 1.5rem 0; }
      .seo-content a { color: #7c3aed; text-decoration: underline; }
      .dark .seo-content a { color: #c4b5fd; }

      .app-bootstrap { display: none; }
      .app-booting #root { display: none; }
      .app-booting body { margin: 0; }
      .app-booting .app-bootstrap {
        display: block; height: 100vh; padding: 88px 24px 24px;
        box-sizing: border-box; overflow: hidden;
      }
      .app-bootstrap-sidebar { display: none; box-sizing: border-box; }
      .app-bootstrap-bar, .app-bootstrap-card {
        background: #e2e8f0; border-radius: 12px;
      }
      .app-bootstrap-bar { height: 24px; width: 160px; margin-bottom: 32px; }
      .app-bootstrap-grid { display: grid; gap: 24px; }
      .app-bootstrap-card { height: 240px; opacity: .6; }
      @media (min-width: 768px) {
        .app-booting .app-bootstrap {
          padding-left: calc(var(--bootstrap-sidebar-width, 256px) + 24px);
        }
        .app-bootstrap-sidebar {
          display: block; position: fixed; inset: 0 auto 0 0;
          width: var(--bootstrap-sidebar-width, 256px);
          background: #ffffff; border-right: 1px solid #e2e8f0;
        }
        .app-bootstrap-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (min-width: 1024px) {
        .app-bootstrap-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-bootstrap-card { animation: bootstrap-pulse 2s ease-in-out infinite; }
        @keyframes bootstrap-pulse { 50% { opacity: .3; } }
      }
    </style>
  </head>
  <body>
    <div class="app-bootstrap" role="status" aria-label="Loading">
      <div aria-hidden="true">
        <div class="app-bootstrap-sidebar"></div>
        <div class="app-bootstrap-bar"></div>
        <div class="app-bootstrap-grid">
          <div class="app-bootstrap-card"></div>
          <div class="app-bootstrap-card"></div>
          <div class="app-bootstrap-card"></div>
          <div class="app-bootstrap-card"></div>
          <div class="app-bootstrap-card"></div>
          <div class="app-bootstrap-card"></div>
        </div>
      </div>
    </div>
    <div id="root"><!-- seo-content --></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
